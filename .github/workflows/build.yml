name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: kiwix-serve indir
        run: |
          curl -L -o kt.tar.gz https://download.kiwix.org/release/kiwix-tools/kiwix-tools_linux-armv8-3.8.2.tar.gz
          tar -xzf kt.tar.gz
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp kiwix-tools_linux-armv8-3.8.2/kiwix-serve app/src/main/jniLibs/armeabi-v7a/libkiwixserve.so

      - name: APK derle
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: KiwixSaat-apk
          path: app/build/outputs/apk/release/app-release.apk
